services:

  db:
    image: postgis/postgis:16-3.4
    container_name: pd_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ponte_digital
      POSTGRES_USER: pd_user
      POSTGRES_PASSWORD: pd_secure_2026
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pd_user -d ponte_digital"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: pd_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://pd_user:pd_secure_2026@db:5432/ponte_digital
      SECRET_KEY: change_this_in_production
    ports:
      - "127.0.0.1:8010:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    container_name: pd_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8011:80"
    depends_on:
      - backend

